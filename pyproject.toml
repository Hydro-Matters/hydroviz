[project]
name = "swotdawgviz"
version = "0.0.1"
authors = [
  { name="Kevin Larnier", email="kevin.larnier@hydro-matters.fr" },
]
description = "SWOT Discharge Algorithm Working Group Visualisation Toolkit"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "geopandas",
    "mapwidget >= 0.1.1",
    "matplotlib >= 3.6.0",
    "numpy >= 1.20.0",
    "pandas >= 2.1.0",
    "plotly >= 5.2.0",
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPL-3.0 License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/klarnier/swotdawgviz"

[build-system]
requires = [
    "setuptools>=42",
]
build-backend = "setuptools.build_meta"
